          if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && !e.shiftKey && !e.altKey && !e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            const currentIdx = state.blocks.findIndex(b => b.id === targetId);
            if (currentIdx === -1) return;
            const nextIdx = e.key === 'ArrowDown'
              ? Math.min(state.blocks.length - 1, currentIdx + 1)
              : Math.max(0, currentIdx - 1);
            if (nextIdx !== currentIdx) {
              const prevId = state.activeBlockId;
              const nextBlock = state.blocks[nextIdx];
              state.activeBlockId = nextBlock.id;
              updateSingleBlockAppearance(prevId);
              updateSingleBlockAppearance(nextBlock.id);
              renderSpeakerQuickBar();
              const nextCard = dom.scriptContainer.querySelector(`[data-block-id="${nextBlock.id}"]`);
              if (nextCard) {
                nextCard.focus({ preventScroll: true });
                nextCard.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
              }
            }
            return;
          }

          // Enterキー：選択中の段落の文字入力状態に入る
          if (e.key === 'Enter' && !e.shiftKey && !e.altKey && !e.ctrlKey && !e.metaKey) {
            e.preventDefault();
            const targetBlock = state.blocks.find(b => b.id === targetId);
            if (targetBlock) {
              focusBlockTextarea(targetBlock.id, targetBlock.text.length);
            }
          }
        });

        // 汎用テキスト(.txt)インポート処理（PCローカルファイル連携にも対応）
        const importTextFile = async (file, handle = null) => {
          if (!file) return;
          try {
            const text = await file.text();
            parsePlainTextToScript(text);
            state.fileHandle = handle;
            state.linkedFileName = file.name;
            updateLinkedFileUI();
            if (!text.includes('【タイトル】')) {
              const nameWithoutExt = file.name.replace(/\.txt$/i, '');
              state.title = nameWithoutExt;
              dom.scriptTitleInput.value = nameWithoutExt;
              scheduleSave();
            }
            showToast(`「${file.name}」を読み込みました`);
          } catch (err) {
            console.error('ファイル読込エラー:', err);
            showToast('ファイルの読み込みに失敗しました', 'error');
          }
        };

        // PCローカルの.txtファイルを開く
        dom.btnOpenLocalFile.addEventListener('click', async () => {
          try {
            if (typeof window.showOpenFilePicker === 'function') {
              const [handle] = await window.showOpenFilePicker({
                types: [{
                  description: 'テキストファイル (.txt)',
                  accept: { 'text/plain': ['.txt'] }
                }],
                multiple: false
              });
              const file = await handle.getFile();
              await importTextFile(file, handle);
              return;
            }
          } catch (err) {
            if (err && err.name === 'AbortError') return;
          }
          dom.fileImportInput.click();
        });

        dom.fileImportInput.addEventListener('change', async (e) => {
          const file = e.target.files && e.target.files[0];
          if (file) {
            await importTextFile(file, null);
          }
          e.target.value = '';
        });

        // 外部.txtファイルのドラッグ＆ドロップ読み込み
        let fileDragDepth = 0;
        window.addEventListener('dragenter', (e) => {
          if (draggedBlockId) return;
          if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) {
            e.preventDefault();
            fileDragDepth++;
            dom.fileDropOverlay.classList.remove('hidden');
          }
        });
        window.addEventListener('dragover', (e) => {
          if (draggedBlockId) return;
          if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) {
            e.preventDefault();
          }
        });
        window.addEventListener('dragleave', () => {
          if (draggedBlockId) return;
          fileDragDepth = Math.max(0, fileDragDepth - 1);
          if (fileDragDepth === 0) {
            dom.fileDropOverlay.classList.add('hidden');
          }
        });
        window.addEventListener('drop', (e) => {
          if (draggedBlockId) return;
          if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
            e.preventDefault();
            fileDragDepth = 0;
            dom.fileDropOverlay.classList.add('hidden');
            importTextFile(e.dataTransfer.files[0], null);
          }
        });

        // その他ドロップダウン開閉
        dom.btnMoreMenu.addEventListener('click', (e) => {
          e.stopPropagation();
          dom.moreDropdown.classList.toggle('hidden');
        });
        document.addEventListener('click', () => {
          dom.moreDropdown.classList.add('hidden');
        });

        // ダークモード切替
        dom.btnToggleDark.addEventListener('click', () => {
          state.darkMode = !state.darkMode;
          applyDarkMode();
          scheduleSave();
        });

        // サンプル台本読込
        dom.btnLoadSample.addEventListener('click', async () => {
          const ok = await showConfirmDialog('サンプル台本の読み込み', '現在の編集内容をサンプル台本に置き換えますか？');
          if (!ok) return;
          state.title = 'サンプル台本（操作ガイド）';
          state.fileHandle = null;
          state.linkedFileName = '';
          updateLinkedFileUI();
          dom.scriptTitleInput.value = state.title;
          state.speakers = getDefaultSpeakers();
          state.blocks = getSampleBlocks();
          state.activeBlockId = state.blocks[0].id;
          state.selectedIds.clear();
          renderScriptBlocks();
          scheduleSave();
          showToast('サンプル台本を読み込みました');
        });

        // 新規作成時はファイルハンドル連携を解除
        dom.btnClearAll.addEventListener('click', async () => {
          const ok = await showConfirmDialog('新規台本の作成', '現在の台本内容をすべて消去して新しく始めますか？');
          if (!ok) return;
          state.title = '無題の台本';
          state.fileHandle = null;
          state.linkedFileName = '';
          updateLinkedFileUI();
          dom.scriptTitleInput.value = state.title;
          state.blocks = [{ id: generateId('blk'), speakerId: state.speakers[2]?.id || 'spk_dir', text: '' }];
          state.activeBlockId = state.blocks[0].id;
          state.selectedIds.clear();
          renderScriptBlocks();
          scheduleSave();
          focusBlockTextarea(state.blocks[0].id, 0);
          showToast('新しい台本を作成しました');
        });

        // 話者登録・編集モーダル
        const openSpeakerModal = () => {
          const nextColor = SPEAKER_PALETTE[state.speakers.length % SPEAKER_PALETTE.length];
          dom.newSpeakerColorInput.value = nextColor;
          renderSpeakerManagerList();
          dom.speakerModal.classList.remove('hidden');
          dom.newSpeakerNameInput.focus();
        };
        const closeSpeakerModal = () => {
          dom.speakerModal.classList.add('hidden');
        };

        dom.btnOpenSpeakerModal.addEventListener('click', openSpeakerModal);
        dom.btnCloseSpeakerModal.addEventListener('click', closeSpeakerModal);
        dom.btnDoneSpeakerModal.addEventListener('click', closeSpeakerModal);

        dom.addSpeakerForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const name = dom.newSpeakerNameInput.value.trim();
          if (!name) return;

          const newSpeaker = {
            id: generateId('spk'),
            name,
            color: dom.newSpeakerColorInput.value,
            type: 'dialogue',
            locked: false
          };
          state.speakers.push(newSpeaker);
          dom.newSpeakerNameInput.value = '';
          dom.newSpeakerColorInput.value = SPEAKER_PALETTE[state.speakers.length % SPEAKER_PALETTE.length];

          renderSpeakerManagerList();
          renderSpeakerQuickBar();
          scheduleSave();
          showToast(`話者「${name}」を追加しました`);
        });

        // 一括編集アクション
        dom.btnSelectAll.addEventListener('click', () => {
          state.blocks.forEach(b => state.selectedIds.add(b.id));
          renderScriptBlocks();
        });

        dom.btnDeselectAll.addEventListener('click', () => {
          state.selectedIds.clear();
          renderScriptBlocks();
        });

        dom.selectBySpeakerDropdown.addEventListener('change', (e) => {
          const targetSpkId = e.target.value;
          if (!targetSpkId) return;
          state.selectedIds.clear();
          state.blocks.forEach((b) => {
            if (b.speakerId === targetSpkId) {
              state.selectedIds.add(b.id);
            }
          });
          e.target.value = '';
          renderScriptBlocks();
        });

        dom.btnBulkAssign.addEventListener('click', () => {
          if (state.selectedIds.size === 0) {
            showToast('変更する段落を選択してください');
            return;
          }
          const targetSpkId = dom.bulkAssignSpeakerSelect.value;
          const spk = getSpeakerById(targetSpkId);
          state.blocks.forEach((b) => {
            if (state.selectedIds.has(b.id)) {
              b.speakerId = targetSpkId;
            }
          });
          renderScriptBlocks();
          scheduleSave();
          showToast(`${state.selectedIds.size}件の段落を「${spk.name}」に変更しました`);
        });

        dom.btnBulkMoveUp.addEventListener('click', () => moveSelectedBlocks(-1));
        dom.btnBulkMoveDown.addEventListener('click', () => moveSelectedBlocks(1));
        dom.btnBulkDuplicate.addEventListener('click', duplicateSelectedBlocks);

        dom.btnBulkDelete.addEventListener('click', async () => {
          if (state.selectedIds.size === 0) {
            showToast('削除する段落を選択してください');
            return;
          }
          const ok = await showConfirmDialog('選択段落の一括削除', `選択中の ${state.selectedIds.size} 件の段落を削除しますか？`);
          if (!ok) return;

          state.blocks = state.blocks.filter(b => !state.selectedIds.has(b.id));
          if (state.blocks.length === 0) {
            state.blocks.push({ id: generateId('blk'), speakerId: state.speakers[2]?.id || 'spk_dir', text: '' });
          }
          state.selectedIds.clear();
          state.activeBlockId = state.blocks[0].id;
          renderScriptBlocks();
          scheduleSave();
          showToast('選択した段落を削除しました');
        });

        // テキスト一括編集モーダル
        const closePlainTextModal = () => dom.plainTextModal.classList.add('hidden');
        dom.btnOpenPlainTextModal.addEventListener('click', () => {
          dom.plainTextEditorArea.value = serializeScriptToPlainText(false);
          dom.plainTextModal.classList.remove('hidden');
        });
        dom.btnClosePlainTextModal.addEventListener('click', closePlainTextModal);
        dom.btnCancelPlainTextModal.addEventListener('click', closePlainTextModal);

        dom.btnCopyPlainText.addEventListener('click', () => {
          dom.plainTextEditorArea.select();
          try {
            document.execCommand('copy');
            showToast('台本テキストをコピーしました');
          } catch (err) {
            showToast('コピーに失敗しました', 'error');
          }
        });

        dom.btnApplyPlainText.addEventListener('click', () => {
          parsePlainTextToScript(dom.plainTextEditorArea.value);
          closePlainTextModal();
          showToast('一括編集の内容を反映しました');
        });

        // ウィンドウリサイズ時に全テキストエリアの高さを再計算
        window.addEventListener('resize', () => {
          dom.scriptContainer.querySelectorAll('textarea').forEach(autoResizeTextarea);
        });
      }

      // 起動処理
      function init() {
        try {
          loadFromStorage();
          applyDarkMode();
          dom.scriptTitleInput.value = state.title;
          bindEvents();
          renderScriptBlocks();
        } catch (err) {
          console.error('初期化エラー:', err);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
